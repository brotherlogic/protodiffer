syntax = "proto3";

package protodiffer;

option go_package = "github.com/brotherlogic/protodiffer/proto";

message TestProto {
  int32 number1 = 1;
  int64 number2 = 2;
  float number3 = 3;
  double number4 = 4;

  string word = 5;

  message Internal {
    int32 number1 = 1;
  }

  Internal internal_message = 6;
}